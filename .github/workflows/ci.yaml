name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '/README.md'
      - '/TODO.md'

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      KO_DOCKER_REPO: ghcr.io/${{ github.repository }}-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test
        run: go test ./...
      - name: Set up ko
        uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: >-
          ko build . --bare
          --push=${{ github.event_name != 'pull_request' }}
          --tags=${{ join(fromJSON(steps.meta.outputs.json).tags, ',') }}
          --image-label=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --image-label=org.opencontainers.image.revision=${{ github.sha }}
